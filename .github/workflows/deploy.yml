name: deploy

# id-token: write は OIDC で AWS の一時クレデンシャルを取得するために必要
permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main

# v* タグではなく main push をトリガーにする理由:
# dev環境を持たない構成でタグ運用にすると「mainにマージしたが本番に出ていない」
# 状態が溜まる。更新の大半が記事投稿で、書いたら即公開したい性質にも合わない
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ROLE_ARN: arn:aws:iam::002075979913:role/pb-github-actions-deploy-prod

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/deploy.yml'
            api:
              - 'api/**'
              - '.github/workflows/deploy.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # OIDC の sub 条件が environment:production の完全一致になっているため必須
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          working_directory: web

      - name: Build
        working-directory: web
        # npm ci ではなく npm install を使う理由:
        # package-lock.json は macOS で生成されており lightningcss と
        # @tailwindcss/oxide の darwin-arm64 版しか記録されていない。
        # npm ci は lock にないパッケージを取得しないため Linux で
        # ネイティブバイナリが見つからずビルドが失敗する。
        run: |
          npm install --include=optional
          npm run build

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # aws cloudfront list-distributions で探すような方法を使わない理由:
      # 旧環境はこれで dev/prod を区別できておらず、誤った環境をパージする恐れがあった
      - name: Get deploy parameters
        run: |
          set -eo pipefail
          echo "BUCKET=$(aws ssm get-parameter --name /pb/prod/cdn/static_bucket_name --query Parameter.Value --output text)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(aws ssm get-parameter --name /pb/prod/cdn/cloudfront_distribution_id --query Parameter.Value --output text)" >> "$GITHUB_ENV"

      - name: Sync to S3
        working-directory: web
        run: |
          set -eo pipefail
          # 実体の同期と不要ファイルの削除。--delete はここ1回だけ付ける
          aws s3 sync out/ "s3://${BUCKET}/" --delete \
            --cache-control "public,max-age=31536000,immutable"
          # HTML等は短期キャッシュに上書きする。--delete を付けると
          # 1回目で除外した分を消してしまうため付けない
          aws s3 sync out/ "s3://${BUCKET}/" \
            --exclude "*" --include "*.html" --include "*.txt" --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" --paths "/*"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    strategy:
      matrix:
        function: [contact-api, contact-notifier]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          working_directory: api

      - name: Build
        working-directory: api/${{ matrix.function }}
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # function.json 内の {{ ssm }} が関数名・ロールARN・テーブル名を解決する
      - name: Deploy with lambroll
        working-directory: api
        run: |
          lambroll deploy \
            --function "deploy/${{ matrix.function }}/function.json" \
            --src "${{ matrix.function }}/dist"
